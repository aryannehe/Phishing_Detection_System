<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PhishDetect — Email Security Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  /* ── Reset & Base ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0c0f;
    --surface:   #111418;
    --panel:     #161b22;
    --border:    #21262d;
    --border-hi: #30363d;
    --text:      #e6edf3;
    --muted:     #7d8590;
    --accent:    #00d4b4;
    --accent-dim:#00d4b420;
    --danger:    #f85149;
    --danger-dim:#f8514912;
    --warn:      #e3b341;
    --warn-dim:  #e3b34112;
    --ok:        #3fb950;
    --ok-dim:    #3fb95012;
    --purple:    #a371f7;
    --purple-dim:#a371f712;
    --font-mono: 'Fira Code', monospace;
    --font-body: 'DM Sans', sans-serif;
    --radius:    8px;
    --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { font-size: 15px; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Scrollbar ────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

  /* ── Layout ───────────────────────────────────────────────────────── */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── Header ───────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 60px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    text-decoration: none;
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--accent), #0096a0);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .logo span.hi { color: var(--accent); }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--muted);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Main ─────────────────────────────────────────────────────────── */
  main {
    flex: 1;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── Section heading ──────────────────────────────────────────────── */
  .section-title {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Input card ───────────────────────────────────────────────────── */
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .card-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .card-header-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    background: var(--accent-dim);
    border: 1px solid var(--accent)30;
  }

  .card-header-text h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .card-header-text p {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 400;
  }

  .card-body { padding: 24px; }

  /* ── Form fields ──────────────────────────────────────────────────── */
  .field { margin-bottom: 20px; }
  .field:last-of-type { margin-bottom: 0; }

  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  label .optional {
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.68rem;
    color: var(--border-hi);
    margin-left: 6px;
  }

  input[type="text"], textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    padding: 12px 14px;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    resize: none;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent)60;
    box-shadow: 0 0 0 3px var(--accent)15;
  }

  input[type="text"]::placeholder, textarea::placeholder {
    color: var(--border-hi);
  }

  textarea { min-height: 200px; font-size: 0.875rem; line-height: 1.65; }

  /* ── Actions row ──────────────────────────────────────────────────── */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-body);
    font-size: 0.875rem;
    font-weight: 500;
    border-radius: var(--radius);
    padding: 11px 20px;
    cursor: pointer;
    border: none;
    transition: all var(--transition);
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
    flex: 1;
    justify-content: center;
    min-width: 160px;
    font-weight: 600;
  }

  .btn-primary:hover:not(:disabled) {
    background: #00eed0;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px var(--accent)40;
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--border-hi);
    color: var(--text);
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px dashed var(--border);
    font-size: 0.8rem;
  }

  .btn-ghost:hover {
    border-color: var(--border-hi);
    color: var(--text);
  }

  /* ── Upload area ──────────────────────────────────────────────────── */
  .upload-zone {
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    background: var(--surface);
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent)60;
    background: var(--accent-dim);
  }

  .upload-zone input { display: none; }

  .upload-zone .upload-icon { font-size: 22px; margin-bottom: 6px; }
  .upload-zone .upload-label {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .upload-zone .upload-label strong {
    color: var(--accent);
    font-weight: 500;
  }
  .upload-zone .upload-hint {
    font-size: 0.72rem;
    color: var(--border-hi);
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  .file-chosen {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: var(--ok);
    margin-top: 10px;
    font-family: var(--font-mono);
    justify-content: center;
  }

  /* ── Loading state ────────────────────────────────────────────────── */
  .loading-bar {
    display: none;
    width: 100%;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
    margin-top: 20px;
  }

  .loading-bar.active { display: block; }

  .loading-bar::after {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: sweep 1.2s ease-in-out infinite;
  }

  @keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  .loading-status {
    display: none;
    text-align: center;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--muted);
  }
  .loading-status.active { display: block; }

  /* ── Results ──────────────────────────────────────────────────────── */
  #results { margin-top: 32px; display: none; }
  #results.visible { display: block; animation: slideUp 0.35s ease-out; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Verdict banner ───────────────────────────────────────────────── */
  .verdict-banner {
    border-radius: 10px;
    border: 1px solid;
    padding: 28px 28px 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .verdict-banner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .verdict-banner.phishing {
    background: var(--danger-dim);
    border-color: var(--danger)40;
  }
  .verdict-banner.phishing::before { background: var(--danger); }

  .verdict-banner.legitimate {
    background: var(--ok-dim);
    border-color: var(--ok)40;
  }
  .verdict-banner.legitimate::before { background: var(--ok); }

  .verdict-top {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }

  .verdict-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .phishing .verdict-icon { background: var(--danger)20; border: 2px solid var(--danger)40; }
  .legitimate .verdict-icon { background: var(--ok)20; border: 2px solid var(--ok)40; }

  .verdict-label {
    font-family: var(--font-mono);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .phishing .verdict-label { color: var(--danger); }
  .legitimate .verdict-label { color: var(--ok); }

  .verdict-sublabel {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
    font-family: var(--font-mono);
  }

  /* ── Confidence meter ─────────────────────────────────────────────── */
  .confidence-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .confidence-bar-wrap {
    flex: 1;
    min-width: 200px;
    background: var(--border);
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }

  .confidence-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }

  .phishing .confidence-bar { background: linear-gradient(90deg, var(--danger)80, var(--danger)); }
  .legitimate .confidence-bar { background: linear-gradient(90deg, var(--ok)80, var(--ok)); }

  .confidence-num {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 600;
    min-width: 46px;
    text-align: right;
    flex-shrink: 0;
  }

  .phishing .confidence-num { color: var(--danger); }
  .legitimate .confidence-num { color: var(--ok); }

  .confidence-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }

  /* ── Grid below verdict ───────────────────────────────────────────── */
